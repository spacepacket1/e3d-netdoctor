server {
    listen 80;
    listen [::]:80;
    server_name netdoctor.e3d.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name netdoctor.e3d.ai;

    ssl_certificate /etc/letsencrypt/live/netdoctor.e3d.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netdoctor.e3d.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Same spacepacket backend cast.e3d.ai talks to — /api/payments/ is already
    # product-generic (see server/stripePayments.js), no new backend needed.
    location /api/payments/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Static site — no Node process required, nginx serves the files directly.
    root /var/www/netdoctor.e3d.ai;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
